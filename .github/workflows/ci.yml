name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:eubp_integration_admin@127.0.0.1:55432/postgres
      DEV_JWT_SECRET: 01234567890123456789012345678901
      AUTH_MODE: dev
      BATTERY_SEMANTIC_CATALOGUE_AVAILABLE: "false"
      REGISTRY_BATTERY_SUBMISSION_AVAILABLE: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: eubp_integration_admin
          POSTGRES_DB: postgres
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install integration-test browser
        run: npx playwright install --with-deps chromium
      - name: Install isolated browser certificate trust tools
        run: sudo apt-get update && sudo apt-get install -y libnss3-tools
      - name: Start isolated MinIO test fixture
        run: docker compose -f docker-compose.integration.yml up -d minio-integration
      - name: Start isolated ClamAV test fixture
        run: docker compose -p eubp-clamav-integration -f docker-compose.malware-integration.yml up -d --wait --wait-timeout 180
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npx prisma validate --schema apps/api/prisma/schema.prisma
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and static tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: PostgreSQL, OIDC, evidence, browser and recovery integration
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: npm run test:integration
      - name: Stop ClamAV test fixture
        if: always()
        run: docker compose -p eubp-clamav-integration -f docker-compose.malware-integration.yml down
      - name: Stop MinIO test fixture
        if: always()
        run: docker compose -f docker-compose.integration.yml down
