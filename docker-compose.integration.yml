services:
  # Frozen, local-only protocol fixture, not a production storage recommendation.
  # RELEASE.2025-09-07T16-13-09Z; source/build pins: test/fixtures/minio/README.md.
  minio-integration:
    build:
      context: ./test/fixtures/minio
    command: server /data --address :9000
    environment:
      MINIO_ROOT_USER: eubp-integration
      MINIO_ROOT_PASSWORD: eubp-integration-secret
      MINIO_BROWSER: "off"
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:18080
    ports: ["127.0.0.1:59000:9000"]
    tmpfs: [/data]
  postgres-integration:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: eubp_integration_admin
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
