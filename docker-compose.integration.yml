services:
  # Frozen, local-only protocol fixture, not a production storage recommendation.
  # RELEASE.2025-09-07T16-13-09Z; see codex/GATE_4_REPORT.md for limitations.
  minio-integration:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --address :9000
    environment:
      MINIO_ROOT_USER: eubp-integration
      MINIO_ROOT_PASSWORD: eubp-integration-secret
      MINIO_BROWSER: "off"
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:18080
    ports: ["127.0.0.1:59000:9000"]
    tmpfs: [/data]
  postgres-integration:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: eubp_integration_admin
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
